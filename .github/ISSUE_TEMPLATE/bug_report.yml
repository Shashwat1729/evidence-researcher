name: Bug report
description: Something is broken or behaving unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, inputs, or a minimal example.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python/Node version, and relevant package versions.
